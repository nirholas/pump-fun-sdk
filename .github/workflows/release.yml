name: Release

on:
  push:
    branches: [main, devnet]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Not .nvmrc (20): semantic-release 25 requires ^22.14 || >=24.10 and
          # exits 1 on anything older. The package itself still targets >=18,
          # which is what CI tests against.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # The CI workflow runs in parallel and cannot block this job, so the
      # same gates run here before anything is published.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run check:package
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
